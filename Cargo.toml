[package]
name = "market-maker-rs"
version = "0.7.1"
edition = "2024"
rust-version = "1.95"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "Quantitative market making in Rust: Avellaneda-Stoikov and GLFT quoting, risk controls, causal backtesting, and a deterministic kernel with RL spaces"
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/market-maker-rs"
homepage = "https://github.com/joaquinbejar/market-maker-rs"
keywords = ["market-making", "avellaneda-stoikov", "glft", "backtesting", "trading"]
categories = ["finance", "mathematics", "algorithms", "simulation"]
include = [
    "benches/**/*",
    "src/**/*",
    "Cargo.toml",
    "/README.md",
    "examples/README.md",
    "LICENSE",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Makefile",
    "rust-toolchain.toml",
    "doc/**/*.md",
    "doc/**/*.json",
]

[lib]
name = "market_maker_rs"
path = "src/lib.rs"

[dependencies]
thiserror = "2.0"
rust_decimal = "1.43"
rust_decimal_macros = "1.40"
# Shared order direction and option style (`Action`, `OptionStyle`). It
# derives serde unconditionally, so serde is in the default build through it
# (owner-approved exception, as in arbitrage-rs). The floor is 0.3.1, the
# first release with the `instruments` module.
financial_types = "0.3.1"
margin-rs = { version = "0.2", optional = true }
arbitrage-rs = { version = "0.3", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
pretty-simple-display = { version = "0.1", optional = true }
async-trait = "0.1"
orderbook-rs = "0.15"
prometheus = { version = "0.14", optional = true }
hyper = { version = "1.11", features = ["server", "http1"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "macros", "sync", "time"], optional = true }
optionstratlib = { version = "0.24.1", default-features = false, features = ["pricing", "clock"], optional = true }
chrono = { version = "0.4", optional = true }
option-chain-orderbook = { version = "0.15", optional = true }
axum = { version = "0.8", optional = true }
utoipa = { version = "6.0", features = ["axum_extras"], optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }

[dev-dependencies]
# Plans the hedges of the kernel's replay gate (tests/support/kernel_gate.rs).
arbitrage-rs = "0.3"
criterion = "0.8"
# The shared, hand computed instrument fixtures, run by the adapter tests.
financial_types = { version = "0.3.1", features = ["fixtures"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt", "time", "rt-multi-thread"] }

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "dep:pretty-simple-display", "rust_decimal/serde"]
prometheus = ["dep:prometheus", "dep:hyper", "dep:http-body-util", "dep:hyper-util", "dep:tokio"]
options = ["dep:optionstratlib", "dep:chrono"]
chain = ["dep:option-chain-orderbook", "options"]
data-feeds = ["dep:tokio"]
# Order by order (L3) book reconstruction; no dependencies.
l3 = []
api = ["dep:axum", "dep:tokio", "dep:utoipa", "dep:tower-http", "serde"]
persistence = ["dep:tokio"]
multi-underlying = ["serde"]
events = ["dep:tokio", "serde"]
# Accounting and pretrade risk through margin-rs.
margin = ["dep:margin-rs"]
# Contract specifications from financial_types (`instruments` module); with
# `margin` too, the conversion into margin-rs instruments, delegated to
# margin-rs. The `?` keeps `instruments` alone from pulling margin-rs.
instruments = ["financial_types/instruments", "margin-rs?/instruments"]
# The net edge of a spot and a dated future (`instruments::basis`), through
# arbitrage-rs, whose types stay out of this crate's public API.
arbitrage = ["instruments", "dep:arbitrage-rs"]
# Deterministic financial kernel for external RL trainers; no dependencies.
kernel = []
# Versioned observation, action and reward spaces over the kernel.
rl = ["kernel"]

