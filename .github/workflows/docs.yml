name: Docs

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  rustdoc:
    name: rustdoc (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - default
          - all-features

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make libfontconfig1-dev pkg-config

      - name: Build docs with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          if [ "${{ matrix.features }}" = "all-features" ]; then
            cargo doc --no-deps --all-features
          else
            cargo doc --no-deps
          fi
